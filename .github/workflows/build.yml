name: Build & Uji Octop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Rilis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK rilis
        run: gradle :app:assembleRelease --stacktrace

      - name: Verifikasi keras APK (zipalign + tanda tangan + badging)
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk > zipalign.log 2>&1 || (cat zipalign.log && exit 1)
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$BT/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -8
          ls -la app/build/outputs/apk/release/

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: octop-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  uji-emulator:
    name: Uji Emulator (pasang & buka)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Unduh APK
        uses: actions/download-artifact@v4
        with:
          name: octop-release-apk

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang & buka di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r app-release.apk
            adb shell pm grant cloud.octop.mobile android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n cloud.octop.mobile/.MainActivity
            sleep 14
            adb exec-out screencap -p > uji-setup.png
            adb shell dumpsys activity activities | grep -i mResumedActivity || true
            adb shell pidof cloud.octop.mobile
            adb logcat -d -t 400 > logcat.txt || true
            ! grep -q "FATAL EXCEPTION" logcat.txt || (grep -A5 "FATAL EXCEPTION" logcat.txt && exit 1)

      - name: Unggah bukti uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-uji-emulator
          path: |
            uji-setup.png
            logcat.txt
          if-no-files-found: warn
